<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>請求書アプリ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root { --bg:#f4f5f7; --card:#fff; --line:#d5d8de; --text:#1d2129; --muted:#6b7280; --accent:#b4232a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:"Meiryo","Yu Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; font-size:14px; -webkit-text-size-adjust:100%; }
.app { max-width:1180px; margin:0 auto; padding:20px 16px 60px; }
h1 { font-size:20px; margin:0 0 4px; }
.lead { color:var(--muted); margin:0 0 16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
.card h2 { font-size:15px; margin:0 0 10px; }
textarea { width:100%; height:180px; font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; resize:vertical; }
button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 14px; cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:bold; }
button.small { padding:3px 8px; font-size:12px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.msg { color:var(--muted); font-size:13px; margin-top:8px; white-space:pre-line; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.tabs button.on { background:var(--text); color:#fff; border-color:var(--text); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-bottom:12px; }
label { display:block; font-size:12px; color:var(--muted); }
label input, label select { display:block; width:100%; margin-top:3px; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
table.edit { width:100%; border-collapse:collapse; }
table.edit th { text-align:left; font-size:12px; color:var(--muted); font-weight:normal; padding:4px; }
table.edit td { padding:3px 4px; }
table.edit input { width:100%; font:inherit; padding:5px 6px; border:1px solid var(--line); border-radius:5px; }
table.edit td.amt { text-align:right; white-space:nowrap; }
.totals { text-align:right; margin-top:10px; line-height:1.8; }
.totals b { font-size:16px; }
#pdfReady { display:none; margin-top:10px; padding:12px; border-radius:8px; background:#fdf2f2; text-align:center; }
#pdfReady button { margin-top:6px; }
@media (max-width: 640px) {
  .app { padding:14px 12px 40px; }
  textarea, label input, label select, table.edit input { font-size:16px; } /* iPhoneで勝手に拡大されないように */
  button { padding:10px 14px; }
  table.edit thead { display:none; }
  table.edit, table.edit tbody { display:block; }
  table.edit tr { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:10px 0; border-bottom:1px solid var(--line); }
  table.edit td { padding:0; }
  table.edit td:nth-child(1) { grid-column:1 / -1; }
  table.edit td:nth-child(2)::before { content:"数量（日）"; display:block; font-size:11px; color:var(--muted); }
  table.edit td:nth-child(3)::before { content:"単価（税抜）／金額"; display:block; font-size:11px; color:var(--muted); }
  table.edit td.amt { text-align:left; font-weight:bold; }
  .row { justify-content:stretch; }
  #btnPrint { width:100%; padding:14px; font-size:16px; }
}
.preview-wrap { overflow:auto; background:#e5e7eb; border-radius:8px; padding:12px; }
.preview-scale { transform-origin:top left; }

/* ---- 請求書本体 ---- */
.page { position:relative; width:297mm; height:210mm; background:#fff; color:#000; font-size:10pt; text-align:left; box-shadow:0 1px 4px rgba(0,0,0,.15); }
.page .title { position:absolute; left:112mm; top:13mm; width:62mm; text-align:center; font-size:22pt; letter-spacing:6pt; border-bottom:2.5pt solid #000; padding-bottom:2mm; }
.page .date { position:absolute; left:185mm; top:21mm; font-size:9.5pt; }
.page .date span { margin-left:10mm; }
.page .to { position:absolute; left:18mm; top:14mm; font-size:9pt; line-height:1.7; }
.page .name { position:absolute; left:18mm; top:33mm; font-size:11pt; font-weight:bold; }
.page .name small { font-weight:normal; font-size:8.5pt; }
.page .from { position:absolute; left:185mm; top:40mm; font-size:9pt; line-height:2.0; }
.page .from b { font-size:10pt; }
.page .seal { position:absolute; left:226mm; top:44mm; width:19mm; height:auto; }
.page .msg2 { position:absolute; left:18mm; top:58mm; font-size:9.5pt; }
.page .subject { position:absolute; left:18mm; top:70mm; width:87mm; border-bottom:1pt solid #000; font-weight:bold; font-size:9pt; padding-bottom:1mm; }
.page .total { position:absolute; left:18mm; top:80mm; width:87mm; border-bottom:1.5pt solid #000; padding-bottom:1mm; }
.page .total b { font-size:9pt; }
.page .total span { font-size:17pt; font-weight:bold; margin-left:22mm; }
.page table { position:absolute; left:18mm; top:98mm; border-collapse:collapse; font-size:10pt; }
.page th { text-align:center; background:#a6a6a6; color:#fff; font-weight:bold; height:6mm; border:1px solid #bfbfbf; font-size:9.5pt; }
.page td { height:6mm; border:1px solid #a6a6a6; padding:0 1mm; }
.page .r { text-align:right; } .page .c { text-align:center; }
.page table.sum { left:130mm; top:auto; }
.page .sum th { width:26mm; letter-spacing:6pt; }
.page .sum td { width:26mm; text-align:right; }
.page .pay { position:absolute; left:18mm; top:172mm; font-size:9pt; line-height:2.2; }
.page .pay b { display:inline-block; width:21mm; white-space:nowrap; }

@page { size:A4 landscape; margin:0; }
@media print {
  body { background:#fff; }
  .app > *:not(#printArea) { display:none !important; }
  .app { padding:0; max-width:none; }
  #printArea { display:block !important; }
  .page { box-shadow:none; }
}
#printArea { display:none; }
#renderArea { position:fixed; left:-10000px; top:0; }
#renderArea .page { box-shadow:none; }
</style>
</head>
<body>
<div class="app">
  <h1>請求書アプリ（株式会社月夜）</h1>
  <p class="lead">LINEなどの内容を貼り付けて「読み込む」を押すと、請求書ができます。内容を確認して「PDFで保存」を押してください。</p>

  <div class="card">
    <h2>① 内容を貼り付ける</h2>
    <textarea id="paste" placeholder="例）
fixer森本さん

ヘルパー
23,000税込×22

ドコモクローザー
21,000＋税×5
22,000＋税×3

交通費 44,360"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="btnParse">読み込む</button>
      <button id="btnBlank">空の請求書を作る</button>
    </div>
    <div class="msg" id="parseMsg"></div>
  </div>

  <div class="card" id="editor" style="display:none">
    <h2>② 内容を確認する</h2>
    <div class="tabs" id="tabs"></div>
    <div class="grid">
      <label>宛先<select id="fClient"></select></label>
      <label>〒<input id="fZip"></label>
      <label>住所<input id="fAddr"></label>
      <label>宛名（御中の前）<input id="fName"></label>
      <label>請求日<input type="date" id="fDate"></label>
      <label>お支払期限<input type="date" id="fDue"></label>
      <label>PDFのファイル名<input id="fFile"></label>
    </div>
    <table class="edit">
      <thead><tr><th style="width:38%">項目</th><th style="width:10%">数量（日）</th><th style="width:16%">単価（税抜）</th><th style="width:16%;text-align:right">金額</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="row" style="margin-top:8px">
      <button class="small" id="btnAddRow">＋ 行を追加</button>
      <button class="small" id="btnAddLump">＋ 交通費など（金額だけ）</button>
    </div>
    <div class="totals" id="totals"></div>
    <div class="row" style="margin-top:12px; justify-content:flex-end">
      <button id="btnDelete">この請求書を消す</button>
      <button class="primary" id="btnPrint">PDFで保存</button>
    </div>
    <div id="pdfReady">PDFができました<br><button class="primary" id="btnShare">保存する・送る</button></div>
    <div class="msg" id="pdfMsg">「PDFで保存」を押すとPDFができます。iPhoneでは、そのあと出てくる「保存する・送る」を押して、「"ファイル"に保存」やLINEを選んでください。</div>
  </div>

  <div class="card" id="previewCard" style="display:none">
    <h2>③ プレビュー</h2>
    <div class="preview-wrap" id="previewWrap"><div class="preview-scale" id="preview"></div></div>
  </div>

  <div id="printArea"></div>
</div>
<div id="renderArea"></div>

let invoices = [];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yen = v => "¥" + Math.round(v).toLocaleString("ja-JP");
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const jpDate = iso => { if (!iso) return ""; const [y,m,d] = iso.split("-").map(Number); return `${y}年${m}月${d}日`; };

function normalize(s) {
  return s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[，、]/g, ",").replace(/[＋]/g, "+").replace(/[×xX＊*✕]/g, "×")
    .replace(/[\s　]+/g, "");
}

function findClient(text) {
  const t = text.toLowerCase();
  return CLIENTS.find(c => c.keywords.some(k => t.includes(k.toLowerCase())));
}

function newInvoice(client) {
  const c = client || CLIENTS[0];
  const today = new Date();
  const due = new Date(today.getFullYear(), today.getMonth() + 2, 0); // 翌月末
  return { clientId:c.id, defaultItem:c.defaultItem || "項目", zip:c.zip, addr:c.addr, name:c.name, date:isoDate(today), due:isoDate(due), file:"", rows:[] };
}

// 貼り付けた文章を請求書の行に変換する
function parse(text) {
  const result = [];
  let inv = null, item = "", notes = [];
  const ensure = () => { if (!inv) { inv = newInvoice(null); result.push(inv); } return inv; };
  for (const raw of text.split(/\r?\n/)) {
    const line = normalize(raw);
    if (!line) continue;
    // 例: 21,000+税×5 / 23,000税込×22 / 交通費4000×6
    let m = line.match(/^(.*?)(\d[\d,]*)円?(\+税|税抜|税別|税込)?×(\d+)(日|回|人)?$/);
    if (m) {
      const target = ensure();
      const name = m[1] || item || target.defaultItem;
      let price = Number(m[2].replace(/,/g, ""));
      if (m[3] === "税込") price = Math.floor(price / (1 + TAX_RATE));
      target.rows.push({ name, qty:Number(m[4]), price, lump:null });
      continue;
    }
    // 例: 交通費44,360 / 44,360これが交通費
    m = line.match(/(\d[\d,]*)/);
    if (m && line.includes("交通費")) {
      ensure().rows.push({ name:"交通費", qty:null, price:null, lump:Number(m[1].replace(/,/g, "")) });
      continue;
    }
    if (/\d/.test(line)) { notes.push(raw.trim()); continue; }
    const c = findClient(line);
    if (c) { inv = newInvoice(c); result.push(inv); item = ""; continue; }
    item = raw.trim();
  }
  return { result: result.filter(i => i.rows.length), notes };
}

function rowAmount(r) { return r.lump != null ? (Number(r.lump) || 0) : (Number(r.qty) || 0) * (Number(r.price) || 0); }
function calc(inv) {
  const sub = inv.rows.reduce((a, r) => a + rowAmount(r), 0);
  const tax = Math.round(sub * TAX_RATE);
  return { sub, tax, total: sub + tax };
}
function defaultFile(inv) { return inv.name.replace(/\s+$/, "") + "御中"; }

function renderPage(inv) {
  const { sub, tax, total } = calc(inv);
  const rows = inv.rows.map(r => r.lump != null
    ? `<tr><td>${esc(r.name)}</td><td></td><td></td><td></td><td class="r">${yen(rowAmount(r))}</td><td></td></tr>`
    : `<tr><td>${esc(r.name)}</td><td class="r">${esc(r.qty ?? "")}</td><td class="c">日</td><td class="r">${yen(r.price || 0)}</td><td class="r">${yen(rowAmount(r))}</td><td></td></tr>`);
  const n = Math.max(10, rows.length);
  while (rows.length < n) rows.push("<tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>");
  const sumTop = 98 + (n + 1) * 6 + 2;
  return `<div class="page">
<div class="to">${esc(inv.zip)}<br>${esc(inv.addr)}</div>
<div class="name">${esc(inv.name)} <small>御中</small></div>
<div class="title">御 請 求 書</div>
<div class="date">請求日 <span>${jpDate(inv.date)}</span></div>
<div class="from"><b>株式会社月夜</b><br>〒703-8271<br>岡山県岡山市中区円山118-6<br>サンライズビル1F西<br>TEL：090-2404-8023<br>登録番号　T4260001038605</div>
<img class="seal" src="${SEAL}" alt="">
<div class="msg2">下記の通り、御請求申し上げます。</div>
<div class="subject">件名：</div>
<div class="total"><b>合計金額</b><span>${yen(total)}</span></div>
<table>
<colgroup><col style="width:87mm"><col style="width:17mm"><col style="width:8mm"><col style="width:26mm"><col style="width:26mm"><col style="width:59mm"></colgroup>
<tr><th style="text-align:left">項目</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th><th>備考</th></tr>
${rows.join("\n")}
</table>
<table class="sum" style="top:${sumTop}mm">
<tr><th>小計</th><td>${yen(sub)}</td></tr>
<tr><th>税率</th><td>${TAX_RATE * 100}%</td></tr>
<tr><th>消費税</th><td>${yen(tax)}</td></tr>
<tr><th>合計</th><td><b>${yen(total)}</b></td></tr>
</table>
<div class="pay" style="top:${sumTop + 6}mm"><b>お支払期限：</b>${jpDate(inv.due)}<br><b>お振込先：</b>おかやま信用金庫　福島支店<br><b></b>普通　573106</div>
</div>`;
}

function renderTabs() {
  $("tabs").innerHTML = invoices.map((inv, i) =>
    `<button class="${i === current ? "on" : ""}" data-i="${i}">${esc(CLIENTS.find(c => c.id === inv.clientId)?.label || inv.name)}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { current = Number(b.dataset.i); renderAll(); });
}

function renderRows() {
  const inv = invoices[current];
  $("rows").innerHTML = inv.rows.map((r, i) => `<tr>
    <td><input data-i="${i}" data-k="name" value="${esc(r.name)}"></td>
    <td>${r.lump != null ? "" : `<input data-i="${i}" data-k="qty" inputmode="numeric" value="${esc(r.qty ?? "")}">`}</td>
    <td>${r.lump != null ? `<input data-i="${i}" data-k="lump" inputmode="numeric" value="${esc(r.lump)}">` : `<input data-i="${i}" data-k="price" inputmode="numeric" value="${esc(r.price ?? "")}">`}</td>
    <td class="amt" id="amt${i}">${yen(rowAmount(r))}</td>
    <td><button class="small" data-del="${i}">消す</button></td></tr>`).join("");
  $("rows").querySelectorAll("input").forEach(el => el.oninput = () => {
    const r = inv.rows[el.dataset.i];
    r[el.dataset.k] = el.dataset.k === "name" ? el.value : Number(normalize(el.value).replace(/,/g, "")) || 0;
    $("amt" + el.dataset.i).textContent = yen(rowAmount(r));
    renderTotals(); renderPreview();
  });
  $("rows").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { inv.rows.splice(Number(b.dataset.del), 1); renderAll(); });
}

function renderTotals() {
  const { sub, tax, total } = calc(invoices[current]);
  $("totals").innerHTML = `小計 ${yen(sub)}　消費税 ${yen(tax)}<br><b>合計 ${yen(total)}</b>`;
}

function renderPreview() {
  $("preview").innerHTML = renderPage(invoices[current]);
  const wrapW = $("previewWrap").clientWidth - 24;
  const pageW = $("preview").firstElementChild.offsetWidth;
  const s = Math.min(1, wrapW / pageW);
  $("preview").style.transform = `scale(${s})`;
  $("preview").style.height = ($("preview").firstElementChild.offsetHeight * s) + "px";
}

function renderForm() {
  const inv = invoices[current];
  $("fClient").value = inv.clientId;
  $("fZip").value = inv.zip; $("fAddr").value = inv.addr; $("fName").value = inv.name;
  $("fDate").value = inv.date; $("fDue").value = inv.due;
  $("fFile").value = inv.file || defaultFile(inv);
}

function renderAll() {
  const has = invoices.length > 0;
  $("editor").style.display = has ? "" : "none";
  $("previewCard").style.display = has ? "" : "none";
  if (!has) return;
  current = Math.min(current, invoices.length - 1);
  renderTabs(); renderForm(); renderRows(); renderTotals(); renderPreview();
}

$("fClient").innerHTML = CLIENTS.map(c => `<option value="${c.id}">${esc(c.label)}</option>`).join("");
$("fClient").onchange = () => {
  const c = CLIENTS.find(c => c.id === $("fClient").value), inv = invoices[current];
  Object.assign(inv, { clientId:c.id, zip:c.zip, addr:c.addr, name:c.name, file:"" });
  renderAll();
};
for (const [id, key] of [["fZip","zip"],["fAddr","addr"],["fName","name"],["fDate","date"],["fDue","due"],["fFile","file"]]) {
  $(id).oninput = () => { invoices[current][key] = $(id).value; if (key === "name" && !invoices[current].file) $("fFile").value = defaultFile(invoices[current]); renderPreview(); };
}

$("btnParse").onclick = () => {
  const { result, notes } = parse($("paste").value);
  if (!result.length) { $("parseMsg").textContent = "読み取れる行がありませんでした。「21,000＋税×5」や「23,000税込×22」のような書き方か確認してください。"; return; }
  invoices.push(...result);
  current = invoices.length - result.length;
  let msg = `${result.length}件の請求書を作りました。内容を確認してください。`;
  if (notes.length) msg += `\n読み取れなかった行：${notes.join(" / ")}（必要なら下の表に手で追加してください）`;
  $("parseMsg").textContent = msg;
  renderAll();
};
$("btnBlank").onclick = () => { invoices.push(newInvoice(null)); current = invoices.length - 1; renderAll(); };
$("btnAddRow").onclick = () => { invoices[current].rows.push({ name:"", qty:1, price:0, lump:null }); renderAll(); };
$("btnAddLump").onclick = () => { invoices[current].rows.push({ name:"交通費", qty:null, price:null, lump:0 }); renderAll(); };
$("btnDelete").onclick = () => { if (confirm("この請求書を消しますか？")) { invoices.splice(current, 1); renderAll(); } };
function printFallback(inv, fileName) {
  $("printArea").innerHTML = renderPage(inv);
  const old = document.title;
  document.title = fileName;
  window.print();
  document.title = old;
}

let pdfFile = null;
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function downloadFile(file) {
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

$("btnShare").onclick = async () => {
  if (!pdfFile) return;
  if (navigator.canShare && navigator.canShare({ files:[pdfFile] })) {
    try { await navigator.share({ files:[pdfFile], title:pdfFile.name }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  downloadFile(pdfFile);
};

$("btnPrint").onclick = async () => {
  const inv = invoices[current];
  const fileName = ($("fFile").value || defaultFile(inv)).replace(/\.pdf$/i, "");
  if (!window.html2canvas || !window.jspdf) { printFallback(inv, fileName); return; }
  const btn = $("btnPrint");
  btn.disabled = true; btn.textContent = "作成中…";
  $("pdfReady").style.display = "none";
  try {
    $("renderArea").innerHTML = renderPage(inv);
    const page = $("renderArea").firstElementChild;
    await document.fonts.ready;
    const canvas = await html2canvas(page, { scale:3, backgroundColor:"#ffffff", useCORS:true });
    const pdf = new jspdf.jsPDF({ orientation:"landscape", unit:"mm", format:"a4" });
    pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 297, 210);
    pdfFile = new File([pdf.output("blob")], fileName + ".pdf", { type:"application/pdf" });
    if (isMobile) $("pdfReady").style.display = "block";
    else downloadFile(pdfFile);
  } catch (e) {
    console.error(e);
    printFallback(inv, fileName);
  } finally {
    $("renderArea").innerHTML = "";
    btn.disabled = false; btn.textContent = "PDFで保存";
  }
};
window.addEventListener("resize", () => invoices.length && renderPreview());
</script>
</body>
</html>
